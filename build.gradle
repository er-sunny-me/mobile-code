buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "io.objectbox:objectbox-gradle-plugin:4.0.3"
        classpath libs.kotlin.gradle.plugin
    }
}
plugins {
    alias(libs.plugins.kotlin.compose) apply false
}


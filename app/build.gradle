plugins {
    id "com.android.application"
    id 'jacoco'
    alias(libs.plugins.kotlin.compose)
}

apply plugin: 'io.objectbox'

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
        implementation "androidx.room:room-runtime:2.6.1"
        implementation "com.squareup.okhttp3:okhttp:4.11.0"
        implementation "io.reactivex.rxjava3:rxjava:3.1.7"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        multiDexEnabled true
        applicationId "com.termux"
        versionCode 130
        versionName "0.0.2"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Mobile Code"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Mobile Code:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Mobile Code:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Mobile Code:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Mobile Code:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Mobile Code:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Mobile Code:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword System.getenv("DEBUG_KEYSTORE_PASSWORD") ?: 'xrj45yWGLbsO7W0v'
            keyPassword System.getenv("DEBUG_KEY_PASSWORD") ?: 'xrj45yWGLbsO7W0v'
        }
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            keyAlias System.getenv("KEY_ALIAS") ?: "alias"
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "dummy_password"
            keyPassword System.getenv("KEY_PASSWORD") ?: "dummy_password"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // Compressed bundle files use the neutral .tar.bin suffix: AAPT2 gunzips
    // anything ending in .gz and strips the suffix (59MB -> 195MB in-APK).
    aaptOptions {
        noCompress 'bin', 'zip'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def version = variant.versionName
            def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: "universal"
            if (variant.buildType.name == "debug") {
                outputFileName = new File("MobileCode-v" + version + "-debug_" + abi + ".apk")
            } else if (variant.buildType.name == "release") {
                outputFileName = new File("MobileCode-v" + version + "-release_" + abi + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }
}

dependencies {
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.core.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation libs.material3
    implementation libs.ui
    implementation libs.ui.graphics
    implementation libs.ui.tooling.preview
    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    testImplementation "org.robolectric:robolectric:4.10"
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.ui.test.junit4
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
    debugImplementation libs.ui.test.manifest
